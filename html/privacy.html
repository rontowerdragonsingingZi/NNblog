    <h1><span class="ico ico-lock" aria-hidden="true"></span>隐私</h1>
    <p>NoteYourNeed（记你需）是一款个人开发的记事软件。如不登录进行同步，则不会进行任何网络连接。笔记保存在本机。</p>
    <p>我们并不建议在这里存放助记词等极其重要的信息。</p>
    <p>登录后，上传云端和同步到社区都要自己操作。本地游客的笔记不能上传。注册和登录使用邮箱与验证码。</p>
    <h2>联系</h2>
    <p>有想加入的功能，或用下来不对的地方，可以写信。核实之后会更新。下面的邮箱和二维码，与应用内「联系我们」是同一套。</p>
